  /** Play audio from entry buffer */
  playAudio(entry) {
    const audio = document.getElementById("playerAudio");
    const isMobile = window.innerWidth <= 768;
    const title = entry._displayName || entry.file.name;
    // Revoke previous URL if any
    if (this._playUrl) URL.revokeObjectURL(this._playUrl);
    const blob = new Blob([entry.buffer], { type: entry.file.type || "audio/mpeg" });
    this._playUrl = URL.createObjectURL(blob);
    audio.src = this._playUrl;
    audio.volume = (parseInt(document.getElementById("playerPanelVolume")?.value || 80)) / 100;
    if (isMobile) {
      document.getElementById("playerBar").style.display = "flex";
      document.body.style.paddingBottom = document.getElementById("playerBar").offsetHeight + "px";
      document.getElementById("playTitle").textContent = title;
      document.getElementById("playToggle").textContent = "⏸";
    } else {
      document.getElementById("playerPanel").style.display = "flex";
      const pTitle = document.getElementById("playerPanelTitle");
      pTitle.textContent = title;
      pTitle.dataset.filename = title;
      document.getElementById("playerPanelToggle").textContent = "⏸";
    }
    this._playingId = entry.id;
    audio.play().catch(() => {});
  },

  /** Show player panel (no autoplay) — does NOT interrupt active playback */
  preparePlayer(entry) {
    if (!entry || !entry.buffer) return;
    const audio = document.getElementById("playerAudio");
    const isMobile = window.innerWidth <= 768;
    const title = entry._displayName || entry.file.name;
    const playing = !audio.paused && audio.src && audio.src !== window.location.href;
    // Show player UI with current entry info
    if (isMobile) {
      document.getElementById("playerBar").style.display = "flex";
      document.body.style.paddingBottom = document.getElementById("playerBar").offsetHeight + "px";
      document.getElementById("playToggle").textContent = playing ? "⏸" : "▶";
    } else {
      document.getElementById("playerPanel").style.display = "flex";
      document.getElementById("playerPanelToggle").textContent = playing ? "⏸" : "▶";
    }
    // Only load audio src if nothing is currently loaded
    if (!audio.src || audio.src === window.location.href) {
      if (this._playUrl) URL.revokeObjectURL(this._playUrl);
      const blob = new Blob([entry.buffer], { type: entry.file.type || "audio/mpeg" });
      this._playUrl = URL.createObjectURL(blob);
      audio.src = this._playUrl;
      audio.volume = (parseInt(document.getElementById("playerPanelVolume")?.value || 80)) / 100;
      this._playingId = entry.id;
      // Set title only when loading new audio; updateUI handles it during playback
      if (!playing) {
        if (isMobile) document.getElementById("playTitle").textContent = title;
        else {
          const pTitle = document.getElementById("playerPanelTitle");
          pTitle.textContent = title;
          pTitle.dataset.filename = title;
        }
      }
    }
  },

  togglePlay() {
    const audio = document.getElementById("playerAudio");
    const isMobile = window.innerWidth <= 768;
    if (audio.paused) {
      audio.play();
      (isMobile ? document.getElementById("playToggle") : document.getElementById("playerPanelToggle")).textContent = "⏸";
    } else {
      audio.pause();
      (isMobile ? document.getElementById("playToggle") : document.getElementById("playerPanelToggle")).textContent = "▶";
    }
  },

  /** Play next track */
  nextTrack() {
    const ids = [...this.files.keys()];
    if (!ids.length) return;
    const idx = ids.indexOf(this._playingId);
    const nextId = idx >= 0 ? ids[(idx + 1) % ids.length] : ids[0];
    const entry = this.files.get(nextId);
    if (entry && entry.buffer) this.playAudio(entry);
  },

  /** Play previous track */
  prevTrack() {
    const ids = [...this.files.keys()];
    if (!ids.length) return;
    const idx = ids.indexOf(this._playingId);
    const prevId = idx >= 0 ? ids[(idx - 1 + ids.length) % ids.length] : ids[ids.length - 1];
    const entry = this.files.get(prevId);
    if (entry && entry.buffer) this.playAudio(entry);
  },

  /** Toggle loop mode: none → list → single → random */
  toggleLoop() {
    const modes = ["none", "list", "single", "random"];
    this._loopMode = ((this._loopMode || 0) + 1) % 4;
    const btn = document.getElementById("btnLoop");
    btn.textContent = ["🔁", "🔁", "🔂", "🔀"][this._loopMode];
    btn.title = ["列表循环", "列表循环", "单曲循环", "随机播放"][this._loopMode];
    const audio = document.getElementById("playerAudio");
    audio.loop = (this._loopMode === 2);
    const resetUI = () => {
      const isM = window.innerWidth <= 768;
      (isM ? document.getElementById("playToggle") : document.getElementById("playerPanelToggle")).textContent = "▶";
    };
    if (this._loopMode === 0) { audio.onended = () => { resetUI(); }; }
    else if (this._loopMode === 3) {
      audio.onended = () => {
        resetUI();
        const ids = [...this.files.keys()];
        if (ids.length) {
          const rnd = ids[Math.floor(Math.random() * ids.length)];
          const e = this.files.get(rnd);
          if (e && e.buffer) this.playAudio(e);
        }
      };
    } else { audio.onended = () => { if (this._loopMode === 1) this.nextTrack(); }; }
  },

  /** Toggle mute on/off */
  toggleMute() {
    const audio = document.getElementById("playerAudio");
    audio.muted = !audio.muted;
    const icon = document.getElementById("btnVolumeIcon");
    if (icon) icon.textContent = audio.muted ? "🔇" : "🔊";
  },

  /** Stop playback and hide player */
  closePlayer() {
    const audio = document.getElementById("playerAudio");
    audio.pause();
    audio.src = "";
    if (this._playUrl) { URL.revokeObjectURL(this._playUrl); this._playUrl = null; }
    document.getElementById("playerBar").style.display = "none";
    document.getElementById("playerPanel").style.display = "none";
    document.body.style.paddingBottom = ""; // Reset mobile padding
  },

  selectFile(id) {
    this.saveCurrentToMemory(); // Save current edits before switching
    this.selectedId = id;
    this.renderFileList();
    this.renderEditor();
  },

  /** Save current editor values back to file entry memory */
  saveCurrentToMemory() {
    if (!this.selectedId) return;
    const entry = this.files.get(this.selectedId);
    if (!entry) return;

    entry.metadata.title      = document.getElementById("tagTitle")?.value      || "";
    entry.metadata.artist     = document.getElementById("tagArtist")?.value     || "";
    entry.metadata.albumArtist= document.getElementById("tagAlbumArtist")?.value|| "";
    entry.metadata.composer   = document.getElementById("tagComposer")?.value   || "";
    entry.metadata.album      = document.getElementById("tagAlbum")?.value      || "";
    entry.metadata.year       = document.getElementById("tagYear")?.value       || "";
    entry.metadata.track      = document.getElementById("tagTrack")?.value      || "";
    entry.metadata.disc       = document.getElementById("tagDisc")?.value       || "";
    entry.metadata.genre      = document.getElementById("tagGenre")?.value      || "";
    entry.metadata.comment    = document.getElementById("tagComment")?.value    || "";
    entry.metadata.lyrics     = document.getElementById("tagLyrics")?.value     || "";

    // Check if actually modified compared to original
    const orig = entry.originalMetadata;
    entry.modified = (
      (entry.metadata.title      !== orig.title)      ||
      (entry.metadata.artist     !== orig.artist)     ||
      (entry.metadata.albumArtist!== orig.albumArtist)||
      (entry.metadata.composer   !== orig.composer)   ||
      (entry.metadata.album      !== orig.album)      ||
      (entry.metadata.year       !== orig.year)       ||
      (entry.metadata.track      !== orig.track)      ||
      (entry.metadata.disc       !== orig.disc)       ||
      (entry.metadata.genre      !== orig.genre)      ||
      (entry.metadata.comment    !== orig.comment)    ||
      (entry.metadata.lyrics     !== orig.lyrics)     ||
      entry.metadata._newCover !== undefined ||
      entry.metadata._removeCover
    );
  },

  /** Render the file list sidebar */
  renderFileList() {
    const container = document.getElementById("fileItems");
    const countEl = document.getElementById("fileCount");

    if (this.files.size === 0) {
      container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.8rem">暂无文件</div>';
      countEl.textContent = "0";
      document.getElementById("clearBtn").disabled = true;
      document.getElementById("editorContent").style.display = "none";
      document.getElementById("editorEmpty").style.display = "flex";
      return;
    }

    countEl.textContent = this.files.size;
    document.getElementById("clearBtn").disabled = false;

    // Update select toggle button text
    const allSelected = this.files.size > 0 && [...this.files.values()].every(e => e._selected);
    document.getElementById("selectToggleBtn").textContent = allSelected ? "☐ 取消全选" : "☑ 全选";

    let html = "";
    for (const [id, entry] of this.files) {
      const active = id === this.selectedId ? " active" : "";
      const statusClass = entry.modified ? "modified" : "original";
      const statusText = entry.modified ? "已修改" : "";
      const ext = entry.file.name.split(".").pop().toUpperCase();
      const size = this.formatSize(entry.file.size);
      const checked = entry._selected ? " checked" : "";
      // Show renamed name or original
      const displayName = entry._displayName || entry.file.name;

      // Create cover blob URL if not yet set
      if (!entry._coverBlobUrl && entry.metadata._cover) {
        const blob = new Blob([entry.metadata._cover.data], { type: entry.metadata._cover.mime });
        entry._coverBlobUrl = URL.createObjectURL(blob);
      }

      html += `
        <div class="file-item${active}" onclick="App.onFileItemClick(event, '${id}')" ondblclick="App.onFileItemDblClick(event, '${id}')">
          <input type="checkbox" ${checked} style="margin-right:4px;accent-color:var(--accent)" onclick="event.stopPropagation();event.preventDefault();return false" title="选中批量操作">
          <div class="icon">${entry._coverBlobUrl ? `<img src="${entry._coverBlobUrl}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${ext.slice(0, 3)}';">` : ext.slice(0, 3)}</div>
          <div class="info">
            <div class="name" title="${this.esc(displayName)}">${this.esc(displayName)}</div>
            <div class="size">${size}</div>
          </div>
          ${statusText ? `<span class="status ${statusClass}">${statusText}</span>` : ""}
        </div>
      `;
    }
    container.innerHTML = html;
  },

  /** Render the editor for the currently selected file */
  renderEditor() {
    if (!this.selectedId) {
      document.getElementById("editorContent").style.display = "none";
      document.getElementById("editorEmpty").style.display = "flex";
      return;
    }

    const entry = this.files.get(this.selectedId);
    if (!entry) return;

    document.getElementById("editorEmpty").style.display = "none";
    document.getElementById("editorContent").style.display = "flex";

    const m = entry.metadata;
    // Show display name (renamed) or original file name
    const displayName = entry._displayName || entry.file.name;
    document.getElementById("currentFileName").textContent = displayName;
    const ext = entry.file.name.split(".").pop().toUpperCase();
    const badgeEl = document.getElementById("formatBadgeDisplay");
    const ftDisplay = document.getElementById("formatTagDisplay");

    // Build audio info array: kbps · kHz · bit · ch
    const info = [];
    let quality = null; // "hr" | "hq" | "sq" | null
    if (entry.flacInfo && entry.flacInfo.streamInfo) {
      const si = entry.flacInfo.streamInfo;
      if (si.sampleRate && si.bitDepth && si.channels) {
        info.push(Math.round(si.sampleRate * si.bitDepth * si.channels / 1000) + "kbps");
      }
      if (si.sampleRate) info.push((si.sampleRate / 1000).toFixed(1).replace(/\.0$/, "") + "kHz");
      if (si.bitDepth) info.push(si.bitDepth + "bit");
      if (si.channels) info.push(si.channels + "ch");
      // FLAC quality: HR if >=24bit or >=96kHz, HQ otherwise
      if (si.bitDepth >= 24 || si.sampleRate >= 96000) quality = "hr";
      else quality = "hq";
    } else if (entry.audioInfo && entry.audioInfo.bitrate) {
      const ai = entry.audioInfo;
      if (ai.bitrate) info.push(ai.bitrate + "kbps");
      if (ai.sampleRate) info.push((ai.sampleRate / 1000).toFixed(1).replace(/\.0$/, "") + "kHz");
      info.push("16bit");
      info.push((ai.channels || 2) + "ch");
      // MP3 quality: >=320kbps=HQ, >=256kbps=SQ, else standard
      if (ai.bitrate >= 320) quality = "hq";
      else if (ai.bitrate >= 256) quality = "sq";
    }

    // Format badge: ext + quality tag
    const tagMap = { hr: ["Hi-Res", "quality-hr"], hq: ["HQ", "quality-hq"], sq: ["SQ", "quality-sq"] };
    badgeEl.innerHTML = ext + (quality && tagMap[quality]
      ? ` <span class="quality-tag ${tagMap[quality][1]}">${tagMap[quality][0]}</span>`
      : "");

    // Audio info: two rows, two pairs each
    if (info.length > 0) {
      const row1 = info.slice(0, 2).join(" · ");
      const row2 = info.slice(2, 4).join(" · ");
      ftDisplay.innerHTML = `<div>${row1}</div><div>${row2}</div>`;
    } else {
      ftDisplay.textContent = "—";
    }

    document.getElementById("tagTitle").value      = m.title       || "";
    document.getElementById("tagArtist").value     = m.artist      || "";
    document.getElementById("tagAlbumArtist").value= m.albumArtist || "";
    document.getElementById("tagComposer").value   = m.composer    || "";
    document.getElementById("tagAlbum").value      = m.album       || "";
    document.getElementById("tagYear").value       = m.year        || "";
    document.getElementById("tagTrack").value      = m.track       || "";
    document.getElementById("tagDisc").value       = m.disc        || "";
    document.getElementById("tagGenre").value      = m.genre       || "";
    document.getElementById("tagComment").value    = m.comment     || "";
    document.getElementById("tagLyrics").value     = m.lyrics      || "";

    // Cover art
    this.renderCover(entry);
    this.searchResults = [];
    this._searchPage = 0;
    document.getElementById("searchResults").innerHTML = "";
    document.getElementById("searchQuery").value = "";

    // Show player panel in paused state (if entry has buffer)
    this.preparePlayer(entry);
  },

  /** Render cover art preview */
  renderCover(entry) {
    const preview = document.getElementById("coverPreview");
    // Reuse existing blob URL to avoid breaking file-list thumbnails
    if (!entry._coverBlobUrl && entry.metadata._cover) {
      const blob = new Blob([entry.metadata._cover.data], { type: entry.metadata._cover.mime });
      entry._coverBlobUrl = URL.createObjectURL(blob);
    }
    if (entry._coverBlobUrl) {
      preview.innerHTML = `<img src="${entry._coverBlobUrl}" alt="封面">`;
    } else {
      preview.innerHTML = '<span class="placeholder">无封面</span>';
    }
  },

  /** Handle cover image file selection */
  async onCoverFileSelected(input) {
    if (!input.files || !input.files[0]) return;
    if (!this.selectedId) return;

    const file = input.files[0];
    if (!file.type.startsWith("image/")) {
      this.toast("请选择图片文件", "error");
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      this.toast("封面图片不能超过 5MB", "error");
      return;
    }

    try {
      const buffer = await file.arrayBuffer();
      const entry = this.files.get(this.selectedId);
      if (!entry) return;

      entry.metadata._newCover = { mime: file.type, data: new Uint8Array(buffer) };
      entry.metadata._removeCover = false;
      entry.metadata._cover = { mime: file.type, data: new Uint8Array(buffer) };
      entry.modified = true;
      // Refresh blob URL so renderCover/FileList picks up the new image
      if (entry._coverBlobUrl) { URL.revokeObjectURL(entry._coverBlobUrl); entry._coverBlobUrl = null; }
      this.renderCover(entry);
      this.renderFileList();
      this.toast("封面已更新", "success");
    } catch (err) {
      this.toast("封面加载失败", "error");
    }
    input.value = ""; // Reset
  },

  /** Remove cover art from current file */
  removeCover() {
    if (!this.selectedId) return;
    const entry = this.files.get(this.selectedId);
    if (!entry) return;

    entry.metadata._removeCover = true;
    entry.metadata._newCover = undefined;
    entry.metadata._cover = null;
    entry.modified = true;
    // Refresh blob URL so renderCover shows placeholder
    if (entry._coverBlobUrl) { URL.revokeObjectURL(entry._coverBlobUrl); entry._coverBlobUrl = null; }
    this.renderCover(entry);
    this.renderFileList();
    this.toast("封面已移除", "info");
  },

  /** Search auto-tag via Worker API */
  async searchTag() {
    this.saveCurrentToMemory();
    if (!this.selectedId) return;

    const entry = this.files.get(this.selectedId);
    if (!entry) return;

    const query = document.getElementById("searchQuery").value.trim();
    const source = document.getElementById("searchSource").value;

    // Auto-fill search from metadata: prefer "title artist", fallback to filename
    if (!query) {
      const artist = entry.metadata.artist || "";
      const title = entry.metadata.title || "";
      if (title || artist) {
        document.getElementById("searchQuery").value = [title, artist].filter(Boolean).join(" ");
      } else {
        // Fallback: extract song name from filename (remove extension)
        document.getElementById("searchQuery").value = entry.file.name.replace(/\.[^.]+$/, "");
      }
    }
    const searchText = document.getElementById("searchQuery").value.trim();

    if (!searchText) {
      this.toast("请输入搜索关键词", "error");
      return;
    }

    document.getElementById("searchQuery").value = searchText;
    const searchBtn = document.getElementById("searchBtn");
    searchBtn.disabled = true;
    searchBtn.textContent = "搜索中...";

    const resultsEl = document.getElementById("searchResults");
    resultsEl.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:.8rem">搜索中...</div>';

    try {
      const resp = await fetch(`/api/tag/search?q=${encodeURIComponent(searchText)}&source=${source}`);
      const data = await resp.json();

      if (data.error) {
        this.toast("搜索失败: " + data.error.message, "error");
        resultsEl.innerHTML = "";
        return;
      }

      this.searchResults = data.results || [];
      this._searchPage = 0;
      this.renderSearchResults();
    } catch (err) {
      this.toast("搜索请求失败", "error");
      resultsEl.innerHTML = "";
    } finally {
      searchBtn.disabled = false;
      searchBtn.textContent = "🔍 搜索";
    }
  },

  /** Render search result cards with pagination (5 per page) */
  renderSearchResults() {
    const el = document.getElementById("searchResults");
    if (this.searchResults.length === 0) {
      el.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:.8rem">未找到匹配结果</div>';
      return;
    }

    const pageSize = this._searchPageSize;
    const totalPages = Math.ceil(this.searchResults.length / pageSize);
    const page = Math.min(this._searchPage, totalPages - 1);
    const start = page * pageSize;
    const batch = this.searchResults.slice(start, start + pageSize);

    let html = batch.map((r, i) => {
      const idx = start + i;
      const coverSrc = r.cover ? `/api/cover/proxy?url=${encodeURIComponent(r.cover)}` : "";
      return `<div class="search-result" data-idx="${idx}">
        <div class="cover">
          ${coverSrc ? `<img src="${coverSrc}" alt="" onerror="this.style.display='none'">` : ""}
        </div>
        <div class="meta">
          <div class="title">${this.esc(r.title)}</div>
          <div class="artist">${this.esc(r.artist)}${r.album ? " · " + this.esc(r.album) : ""}</div>
        </div>
        <span class="source">${r.source || ""}</span>
        <button class="btn btn-primary btn-sm" onclick="App.applyTag(${idx})">应用</button>
      </div>`;
    }).join("");

    // Pagination controls
    if (totalPages > 1) {
      html += `<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0 0 0;font-size:.8rem;color:var(--text-muted)">
        <button class="btn btn-sm btn-secondary" onclick="App._searchPage=Math.max(0,App._searchPage-1);App.renderSearchResults()"
          ${page === 0 ? 'disabled' : ''}>◀ 上一页</button>
        <span>${page + 1} / ${totalPages}</span>
        <button class="btn btn-sm btn-secondary" onclick="App._searchPage=Math.min(${totalPages - 1},App._searchPage+1);App.renderSearchResults()"
          ${page >= totalPages - 1 ? 'disabled' : ''}>下一页 ▶</button>
      </div>`;
    }

    el.innerHTML = html;

    // Load covers asynchronously for items with album picId
    this._loadCoversAsync();
  },

  /** Load album covers asynchronously after rendering search results */
  async _loadCoversAsync() {
    for (let i = 0; i < this.searchResults.length; i++) {
      const r = this.searchResults[i];
      if (r.cover || !r._albumPicId) continue;
      // Skip results with album picId 0 (placeholder)
      if (r._albumPicId === 0 || r._albumPicId === "0") continue;
      try {
        const resp = await fetch(`/api/cover/album?id=${encodeURIComponent(r.id)}`);
        if (resp.ok) {
          const data = await resp.json();
          if (data.picUrl) {
            r.cover = data.picUrl;
            // Update the img src in-place via DOM
            const el = document.querySelector(`.search-result[data-idx="${i}"] .cover img`);
            if (el) {
              el.src = `/api/cover/proxy?url=${encodeURIComponent(data.picUrl)}`;
              el.style.display = "";
            } else {
              // No img element yet — create one
              const coverDiv = document.querySelector(`.search-result[data-idx="${i}"] .cover`);
              if (coverDiv) {
                coverDiv.innerHTML = `<img src="/api/cover/proxy?url=${encodeURIComponent(data.picUrl)}" alt="">`;
              }
            }
          }
        }
      } catch (e) { /* cover load failed — keep placeholder */ }
    }
  },

  /** Apply a search result to the current file's metadata */
  applyTag(index) {
    if (!this.selectedId) return;
    const result = this.searchResults[index];
    if (!result) return;

    const entry = this.files.get(this.selectedId);
    if (!entry) return;

    // Apply all available fields
    if (result.title)       entry.metadata.title       = result.title;
    if (result.artist)      entry.metadata.artist      = result.artist;
    if (result.album)       entry.metadata.album       = result.album;
    if (result.albumArtist) entry.metadata.albumArtist = result.albumArtist || result.artist || "";
    if (result.composer)    entry.metadata.composer    = result.composer || "";
    if (result.year)        entry.metadata.year        = result.year || "";
    if (result.track)       entry.metadata.track       = result.track || "";
    if (result.disc)        entry.metadata.disc        = result.disc || "";
    if (result.genre)       entry.metadata.genre       = result.genre || "";

    this.renderEditor();

    // Try to download cover image via proxy
    if (result.cover) {
      this.downloadCoverFromUrl(result.cover, entry);
    }
    // Try to fetch lyrics if song ID is available (NetEase source)
    if (result.id && result.source === "netease") {
      this.fetchLyricsById(result.id, entry);
    }

    this.toast("已应用标签: " + result.title, "success");
  },

  /** Download cover image from URL via Worker proxy and store in metadata */
  async downloadCoverFromUrl(coverUrl, entry) {
    try {
      const proxyUrl = `/api/cover/proxy?url=${encodeURIComponent(coverUrl)}`;
      const resp = await fetch(proxyUrl);
      if (!resp.ok) return;

      const blob = await resp.blob();
      if (blob.size < 1000) return; // Too small, probably an error image

      const buffer = await blob.arrayBuffer();
      entry.metadata._newCover = { mime: blob.type || "image/jpeg", data: new Uint8Array(buffer) };
      entry.metadata._removeCover = false;
      entry.metadata._cover = { mime: blob.type || "image/jpeg", data: new Uint8Array(buffer) };
      entry.modified = true;
      // Refresh blob URL
      if (entry._coverBlobUrl) { URL.revokeObjectURL(entry._coverBlobUrl); entry._coverBlobUrl = null; }

      this.renderCover(entry);
      this.renderFileList();
    } catch (e) {
      // Cover download failed silently — not critical
    }
  },

  /** Fetch lyrics from NetEase API via Worker proxy */
  async fetchLyricsById(songId, entry) {
    try {
      const resp = await fetch(`/api/lyrics/fetch?id=${encodeURIComponent(songId)}`);
      if (!resp.ok) return;
      const data = await resp.json();
      if (data.lyrics && data.lyrics.trim()) {
        entry.metadata.lyrics = data.lyrics;
        document.getElementById("tagLyrics").value = data.lyrics;
        this.toast("已获取歌词", "success");
      }
    } catch (e) { /* lyrics fetch failed silently */ }
  },

  /** Parse filename to extract artist/title (e.g. "Artist - Title.mp3") */
  parseFilenameToTags() {
    if (!this.selectedId) return;
    const entry = this.files.get(this.selectedId);
    if (!entry) return;

    const name = entry.file.name.replace(/\.[^.]+$/, ""); // Remove extension
    const patterns = [
      /^(.+?)\s*[-–—]\s*(.+)$/,       // Artist - Title
      /^(.+?)\s*[-–—]\s*(.+)$/,       // Artist–Title
      /^[(（]\d+[)）]\s*(.+?)\s*[-–—]\s*(.+)$/, // (01) Artist - Title
    ];

    for (const p of patterns) {
      const m = name.match(p);
      if (m) {
        entry.metadata.artist = m[1].trim();
        entry.metadata.title = m[2].trim();
        this.renderEditor();
        this.toast("已解析: " + m[1].trim() + " - " + m[2].trim(), "success");
        return;
      }
    }

    this.toast("无法解析文件名格式，尝试使用 'Artists - Title' 格式", "error");
  },

  /** Rename current file — prompt user for new download filename */
  renameCurrent() {
    if (!this.selectedId) return;
    const entry = this.files.get(this.selectedId);
    if (!entry) return;

    const ext = entry.file.name.split(".").pop();
    const current = entry._downloadName || entry._displayName || entry.file.name;
    const baseName = current.replace(/\.[^.]+$/, "");
    const newName = prompt("输入下载文件名（不含扩展名）:", baseName);
    if (!newName || newName.trim() === "") return;

    const fullName = newName.trim() + "." + ext;
    entry._downloadName = fullName;
    entry._displayName = fullName;
    this.renderEditor();
    this.renderFileList();
    this.toast("下载时将使用: " + fullName, "info");
  },

  /** Save current edits (write ID3 to buffer) */
  saveCurrent() {
    this.saveCurrentToMemory();
    if (!this.selectedId) return;

    const entry = this.files.get(this.selectedId);
    if (!entry || !entry.buffer) {
      this.toast("无法保存: 文件数据不可用", "error");
      return;
    }

    // MP3 uses ID3.write, FLAC uses FLAC.write
    const isFLAC = entry.flacInfo && entry.flacInfo.isFLAC;
    const isMP3 = this._isMP3(entry);

    if (!isMP3 && !isFLAC) {
      this.toast("非 MP3/FLAC 格式暂不支持浏览器端保存", "error");
      return;
    }

    try {
      let newBuffer;
      if (isFLAC) {
        newBuffer = FLAC.write(entry.buffer, entry.metadata, entry.flacInfo);
        entry.flacInfo = FLAC.read(newBuffer);
      } else {
        newBuffer = ID3.write(entry.buffer, entry.metadata, entry.id3);
        entry.id3 = ID3.read(newBuffer); // Re-parse
      }
      entry.buffer = newBuffer;
      entry.modified = true;

      this.renderFileList();
      this.toast("标签已保存到内存", "success");
    } catch (err) {
      this.toast("保存失败: " + err.message, "error");
    }
  },

  /** Download the current file with modified tags */
  async downloadCurrent() {
    this.saveCurrentToMemory();

    if (!this.selectedId) return;
    const entry = this.files.get(this.selectedId);
    if (!entry || !entry.buffer) return;

    // Auto-save unsaved changes before download
    if (this._hasUnsavedChanges(entry)) {
      this.saveCurrent();
    }

    // Ensure buffer has latest tags
    const isFLAC = entry.flacInfo && entry.flacInfo.isFLAC;
    if (entry.modified === false && this._hasUnsavedChanges(entry)) {
      try {
        if (isFLAC) {
          entry.buffer = FLAC.write(entry.buffer, entry.metadata, entry.flacInfo);
          entry.flacInfo = FLAC.read(entry.buffer);
        } else if (this._isMP3(entry)) {
          entry.buffer = ID3.write(entry.buffer, entry.metadata, entry.id3);
          entry.id3 = ID3.read(entry.buffer);
        }
      } catch (e) { /* proceed with original */ }
    }

    const blob = new Blob([entry.buffer], { type: entry.file.type || "audio/mpeg" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = entry._downloadName || entry.file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    this.toast("下载完成: " + (entry._downloadName || entry.file.name), "success");
  },

  /** Check if editor has unsaved changes vs entry.metadata */
  _hasUnsavedChanges(entry) {
    return (
      (entry.metadata.title      || "") !== (document.getElementById("tagTitle")?.value      || "") ||
      (entry.metadata.artist     || "") !== (document.getElementById("tagArtist")?.value     || "") ||
      (entry.metadata.albumArtist|| "") !== (document.getElementById("tagAlbumArtist")?.value|| "") ||
      (entry.metadata.composer   || "") !== (document.getElementById("tagComposer")?.value   || "") ||
      (entry.metadata.album      || "") !== (document.getElementById("tagAlbum")?.value      || "") ||
      (entry.metadata.year       || "") !== (document.getElementById("tagYear")?.value       || "") ||
      (entry.metadata.track      || "") !== (document.getElementById("tagTrack")?.value      || "") ||
      (entry.metadata.disc       || "") !== (document.getElementById("tagDisc")?.value       || "") ||
      (entry.metadata.genre      || "") !== (document.getElementById("tagGenre")?.value      || "") ||
      (entry.metadata.comment    || "") !== (document.getElementById("tagComment")?.value    || "") ||
      (entry.metadata.lyrics     || "") !== (document.getElementById("tagLyrics")?.value     || "") ||
      entry.metadata._newCover !== undefined ||
      entry.metadata._removeCover
    );
  },

  /** Check if file is MP3 (browser-side ID3 writing only works for MP3) */
  _isMP3(entry) {
    const ext = entry.file.name.split(".").pop().toLowerCase();
    return ext === "mp3";
  },

  _isWritable(entry) {
    return this._isMP3(entry) || (entry.flacInfo && entry.flacInfo.isFLAC);
  },

  /** Reset current file's metadata to original */
  async resetCurrent() {
    if (!this.selectedId) return;
    const entry = this.files.get(this.selectedId);
    if (!entry) return;

    entry.metadata = { ...entry.originalMetadata };
    delete entry.metadata._newCover;
    delete entry.metadata._removeCover;
    entry.modified = false;
    // Clear cover blob URL so renderCover regenerates from original metadata
    if (entry._coverBlobUrl) { URL.revokeObjectURL(entry._coverBlobUrl); entry._coverBlobUrl = null; }

    // Reset buffer to original — await to ensure state consistency
    try {
      const buf = await entry.file.arrayBuffer();
      entry.buffer = buf;
      entry.id3 = ID3.read(buf);
    } catch (e) {
      this.toast("还原失败: 无法重新读取文件", "error");
      return;
    }

    this.renderEditor();
    this.renderFileList();
    this.toast("已还原为原始标签", "info");
  },

  /** Clear all files — also revoke blob URLs to prevent memory leaks */
  clearAll() {
    // Revoke all cover blob URLs before clearing
    for (const [id, entry] of this.files) {
      if (entry._coverBlobUrl) {
        URL.revokeObjectURL(entry._coverBlobUrl);
        entry._coverBlobUrl = null;
      }
    }
    this.files.clear();
    this.selectedId = null;
    this.searchResults = [];
    this._searchPage = 0;
    this.renderFileList();
  },

  /** Clear only selected files */
  clearSelected() {
    const hasAnySelected = [...this.files.values()].some(e => e._selected);
    if (!hasAnySelected) return;
    for (const [id, entry] of this.files) {
      if (entry._selected) {
        if (entry._coverBlobUrl) {
          URL.revokeObjectURL(entry._coverBlobUrl);
          entry._coverBlobUrl = null;
        }
        this.files.delete(id);
      }
    }
    this.selectedId = null;
    this.renderFileList();
  },

  /** Show a toast notification */
  toast(message, type = "info") {
    const container = document.getElementById("toastContainer");
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transition = "opacity .3s";
      setTimeout(() => el.remove(), 300);
    }, 2500);
  },

  /** Format file size in human-readable form */
  formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  },

  /** Escape HTML entities */
  esc(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  },
};

  // Register v4.0 component (replaces old definition)
  customElements.define("theme-button", ThemeButtonV4);

  // ── Ripple Animation (View Transitions API) ──
  let _rippleSyncing = false;
  let _rippleX = 0, _rippleY = 0;
  document.addEventListener('click', e => { _rippleX = e.clientX; _rippleY = e.clientY; }, true);

  function applyRippleTheme(isDark) {
    if (_rippleSyncing) return;
    _rippleSyncing = true;

    // Apply actual theme change
    const doToggle = () => {
      if (isDark) document.body.classList.remove('light');
      else document.body.classList.add('light');
      localStorage.setItem('music-tag-theme', isDark ? 'dark' : 'light');
    };

    if (document.startViewTransition) {
      const cx = _rippleX, cy = _rippleY;
      const endRadius = Math.hypot(
        Math.max(cx, innerWidth - cx),
        Math.max(cy, innerHeight - cy)
      );
      const vt = document.startViewTransition(doToggle);
      vt.ready.then(() => {
        document.documentElement.animate(
          { clipPath: [
            `circle(0 at ${cx}px ${cy}px)`,
            `circle(${endRadius}px at ${cx}px ${cy}px)`
          ] },
          {
            duration: 1400,
            easing: 'cubic-bezier(0.4, 0, 0.5, 1)',
            fill: 'forwards',
            pseudoElement: '::view-transition-new(root)'
          }
        );
        _rippleSyncing = false;
      }).catch(() => { doToggle(); _rippleSyncing = false; });
    } else {
      doToggle();
      _rippleSyncing = false;
    }
  }

  // Listen for v4.0 theme-button change event → trigger ripple
  const themeBtn = document.getElementById('themeBtn');
  if (themeBtn) {
    themeBtn.addEventListener('change', (e) => {
      applyRippleTheme(e.detail === 'dark');
    });
  }

  App.init();
