<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Tag Editor - Cloudflare Edition</title>
<style>
/* ── View Transitions (for v4.0 ripple animation) ── */
::view-transition-old(root) { animation: none; }
::view-transition-new(root) { animation: none; }

/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0f0f14;
  --bg-secondary:#1a1a24;
  --bg-card:#222231;
  --bg-input:#2a2a3a;
  --border:#3a3a50;
  --border-focus:#2563EB;
  --text-primary:#e8e8f0;
  --text-secondary:#9898b0;
  --text-muted:#6a6a80;
  --accent:#2563EB;
  --accent-hover:#3B82F6;
  --success:#00cec9;
  --danger:#e17055;
  --warning:#fdcb6e;
  --radius:10px;
  --radius-lg:16px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
/* Light theme */
body.light{
  --bg-primary:#f5f5f8;
  --bg-secondary:#ffffff;
  --bg-card:#f0f0f5;
  --bg-input:#ffffff;
  --border:#d0d0dd;
  --border-focus:#2563EB;
  --text-primary:#1a1a2e;
  --text-secondary:#555570;
  --text-muted:#8888a0;
  --shadow:0 4px 24px rgba(0,0,0,.1);
}
html{font-size:16px;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  min-height:100%;
  line-height:1.6;
}
a{color:var(--accent);text-decoration:none}

/* ── Layout ── */
.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;height:100vh;}
.header{
  background:var(--bg-secondary);
  border-bottom:1px solid var(--border);
  padding:10px 20px;
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
}
.header h1{font-size:1.5rem;font-weight:600;letter-spacing:-.3px;line-height:1}
.main{display:flex;flex:1;gap:0;overflow:hidden}
.panel{padding:16px}

/* ── Upload Zone ── */
.upload-panel{
  width:40.7%;min-width:280px;max-width:440px;
  background:var(--bg-secondary);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:16px;
  overflow:hidden;
}
.dropzone{
  border:2px dashed var(--border);
  border-radius:var(--radius-lg);
  padding:32px 16px;
  text-align:center;
  cursor:pointer;
  transition:all .2s;
  background:var(--bg-card);
  flex-shrink:0;
}
.dropzone:hover,.dropzone.dragover{
  border-color:var(--accent);
  background:rgba(37,99,235,.08);
}
.dropzone svg{width:48px;height:48px;margin-bottom:12px;opacity:.5}
.dropzone p{color:var(--text-secondary);font-size:.85rem}
.dropzone .browse{color:var(--accent);font-weight:500}
.format-hint{color:var(--text-muted);font-size:.75rem;margin-top:4px}

/* ── File List ── */
.file-list{flex:1;overflow-y:auto;min-height:0;padding-bottom:0}
.file-list h3{
  font-size:.8rem;text-transform:uppercase;letter-spacing:1px;
  color:var(--text-muted);margin-bottom:0;white-space:nowrap;
}
.file-list-header{
  display:flex;align-items:center;gap:8px;
  margin-bottom:0;flex-wrap:nowrap;
  position:sticky;top:0;z-index:2;background:var(--bg-secondary);
  padding-bottom:10px
}
.file-list-header h3{
  font-size:.78rem;text-transform:uppercase;letter-spacing:1px;
  color:var(--text-muted);margin:0;white-space:nowrap;flex-shrink:2;
}
.file-list-actions{
  display:flex;gap:4px;flex-wrap:nowrap;margin-left:auto;flex-shrink:0;
}
.file-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin-bottom:6px;
  border-radius:var(--radius);cursor:pointer;
  background:var(--bg-card);border:1px solid transparent;
  transition:all .15s;
}
.file-item:hover{border-color:var(--border)}
.file-item.active{border-color:var(--accent);background:rgba(37,99,235,.1)}
.file-item .icon{
  width:36px;height:36px;border-radius:6px;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:700;color:#fff;flex-shrink:0;
  overflow:hidden;
}
.file-item .icon img{width:100%;height:100%;object-fit:cover}
.file-item .info{flex:1;min-width:0}
.file-item .name{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .size{font-size:.7rem;color:var(--text-muted)}
.file-item .status{font-size:.65rem;padding:2px 8px;border-radius:10px;flex-shrink:0}
.file-item .status.modified{background:rgba(0,206,201,.15);color:var(--success)}
.file-item .status.original{background:rgba(106,106,128,.15);color:var(--text-muted)}

/* ── Editor Panel ── */
.editor-panel{flex:1;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--border);box-shadow:-2px 0 12px rgba(0,0,0,.08);overflow-y:auto}
/* Hidden scrollbar — scrollable but no visible bar */
.file-list::-webkit-scrollbar,.editor-panel::-webkit-scrollbar{width:0;display:none}
.file-list,.editor-panel{scrollbar-width:none;-ms-overflow-style:none}
.editor-empty{
  display:flex;align-items:center;justify-content:center;flex:1;
  color:var(--text-muted);font-size:.9rem;
}
.editor-content{display:flex;flex-direction:column;gap:8px}
.editor-header{
  display:flex;align-items:center;gap:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
}
.editor-header h2{font-size:.9rem;font-weight:600;flex:1;min-width:0}
.editor-header .btn{padding:6px 12px;font-size:.78rem;white-space:nowrap}

/* ── Editor Grid ── */
.editor-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.editor-grid.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-muted);font-weight:500;
}
.form-group input,.form-group textarea,.form-group select{
  background:var(--bg-input);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:8px 10px;
  color:var(--text-primary);
  font-size:.82rem;
  font-family:inherit;
  transition:border-color .2s;
  outline:none;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  border-color:var(--border-focus);
}
.form-group textarea{resize:vertical;min-height:60px}

/* ── Cover Art Row ── (matches editor-grid 2-col for alignment) */
.cover-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;margin-bottom:6px}
.cover-left{display:flex;gap:8px;align-items:stretch;min-width:0}
.cover-preview{
  width:100%;aspect-ratio:1;max-width:200px;border-radius:var(--radius);
  background:var(--bg-input);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;justify-self:start;
}
.cover-preview img{width:100%;height:100%;object-fit:cover}
.cover-preview .placeholder{color:var(--text-muted);font-size:.7rem;text-align:center;padding:4px}
.cover-actions{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.cover-actions .btn-cover{
  width:100%;background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 12px;
  color:var(--text-primary);font-size:.85rem;font-family:inherit;
  cursor:pointer;text-align:center;transition:border-color .15s;
}
.cover-actions .btn-cover:hover{border-color:var(--border-focus)}

/* ── Audio Info & Format Badge ── */
.audio-info-row{
  background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 12px;
  color:var(--text-primary);font-size:.85rem;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:2px;
}
.format-badge{
  background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 12px;
  color:var(--text-primary);font-size:.9rem;font-weight:700;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.format-badge .quality-tag{
  font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:3px;
  color:#fff;
}
.quality-hr{background:#D4838F}    /* Hi-Res 粉 */
.quality-hq{background:#6BA08E}    /* HQ 绿 */
.quality-sq{background:#9A8CBF}    /* SQ 紫 */
.quality-cd{background:#5B8CB8}    /* CD品质 蓝 */

/* ── Player Panel (desktop, 3rd column) ── */
.player-panel{
  display:flex;flex-direction:column;gap:6px;
  padding:8px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);justify-content:center;
}
.player-panel-title{font-size:.82rem;font-weight:600;color:var(--text-primary);text-align:center;word-break:break-all}
.player-row{display:flex;align-items:center;gap:6px;justify-content:center}
.player-row .player-btn-sm{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--text-primary);padding:4px 6px}
.player-row .player-seek{flex:1;min-width:60px;accent-color:var(--accent)}
.player-row .player-time{font-size:.72rem;color:var(--text-muted);white-space:nowrap}
.player-extra-row{display:flex;align-items:center;gap:6px;justify-content:center}
.player-extra-row .player-btn-sm{background:none;border:none;font-size:.9rem;cursor:pointer;color:var(--text-primary);padding:4px 6px}
.player-extra-row .volume-slider{width:70px;accent-color:var(--accent)}
.player-close-btn{position:absolute;top:4px;right:8px;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:8px 16px;border:none;border-radius:var(--radius);
  font-size:.82rem;font-weight:500;cursor:pointer;
  transition:all .2s;font-family:inherit;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{opacity:.9}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 14px;font-size:.78rem;white-space:nowrap;flex-shrink:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.actions{border-top:1px solid var(--border);padding:8px 10px;background:var(--bg-card);border-radius:var(--radius);margin-top:6px;display:flex;flex-wrap:nowrap;gap:6px}
.actions .btn{white-space:nowrap;padding:8px 12px;font-size:.8rem;flex:1 1 0;min-width:0}
.actions .btn-group{display:contents}

/* ── Player Bar ── */
.player-bar{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);margin-top:8px;
}
.player-btn{
  background:none;border:none;font-size:1.2rem;cursor:pointer;
  color:var(--text-primary);padding:4px;line-height:1;
}
.player-title{font-size:.82rem;color:var(--text-primary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-seek{flex:2;min-width:80px;accent-color:var(--accent)}
.player-time{font-size:.75rem;color:var(--text-muted);white-space:nowrap}
.player-close{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--text-muted);padding:4px}

/* ── Search Panel ── */
.search-section{margin-top:6px}
.search-bar{display:flex;gap:8px;align-items:stretch}
.search-bar input:focus,.search-bar select:focus{border-color:var(--border-focus)}
.search-bar input{flex:1}
.search-results{margin-top:12px}
.search-result{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;margin-bottom:6px;
  background:var(--bg-card);border-radius:var(--radius);
  border:1px solid var(--border);
}
.search-result .cover{
  width:48px;height:48px;border-radius:6px;overflow:hidden;
  background:var(--bg-input);flex-shrink:0;
}
.search-result .cover img{width:100%;height:100%;object-fit:cover}
.search-result .meta{flex:1;min-width:0}
.search-result .title{font-size:.85rem;font-weight:500}
.search-result .artist{font-size:.75rem;color:var(--text-secondary)}


/* ── Progress ── */
.toast{
  position:fixed;bottom:24px;right:24px;
  padding:12px 20px;border-radius:var(--radius);
  font-size:.85rem;z-index:1000;animation:slideIn .3s ease;
  max-width:400px;
}
.toast.info{background:var(--accent);color:#fff}
.toast.success{background:var(--success);color:#000}
.toast.error{background:var(--danger);color:#fff}
.toast.loading{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border)}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── Responsive ── */
@media(max-width:768px){
  body{font-size:14px;line-height:1.5}
  .main{flex-direction:column;min-height:0}
  .panel{padding:12px}
  .header{padding:10px 16px;gap:8px}
  .header h1{font-size:1.3rem}
  .upload-panel{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);flex-shrink:0}
  .dropzone{padding:12px 10px}
  .dropzone svg{width:24px;height:24px;margin-bottom:6px}
  .dropzone p{font-size:.72rem}
  .dropzone .format-hint{font-size:.65rem;margin-top:2px}
  .file-list{max-height:25vh;flex:auto}
  .file-list-header{margin-bottom:0;padding-bottom:8px;gap:4px}
  .file-list-header h3{font-size:.7rem}
  .file-list-actions{gap:3px}
  .file-list-actions .btn-sm{padding:3px 5px;font-size:.65rem}
  .file-list h3{font-size:.72rem;margin-bottom:8px}
  .file-item{padding:8px 10px;gap:6px;font-size:.78rem}
  .file-item .name{font-size:.75rem}
  .editor-content{gap:10px}
  .editor-header{padding-bottom:6px;gap:6px;align-items:center}
  .editor-header h2{font-size:.78rem;line-height:1.3;word-break:break-all}
  .editor-header .btn{font-size:.72rem;padding:6px 10px;flex-shrink:0}
  .cover-row{display:grid;grid-template-columns:1fr;gap:8px;align-items:stretch}
  .cover-left{gap:8px}
  .cover-preview{width:100%;aspect-ratio:1;max-width:160px;min-width:64px;border-radius:6px;justify-self:start}
  .cover-actions{gap:4px;min-width:0;justify-content:space-evenly}
  .player-panel{display:none!important} /* mobile uses fixed playerBar */
  .cover-actions .btn-cover{font-size:.75rem;padding:7px 8px}
  .audio-info-row{font-size:.75rem;padding:5px 8px;gap:2px}
  .format-badge{font-size:.78rem;padding:5px 8px}
  .format-badge .quality-tag{font-size:.6rem;padding:1px 6px}
  .editor-grid{grid-template-columns:1fr 1fr;gap:8px}
  .editor-grid .form-group label{font-size:.65rem}
  .editor-grid .form-group input{padding:7px 8px;font-size:.75rem}
  .search-section{margin-top:4px}
  .search-bar{flex-wrap:nowrap;gap:4px}
  .search-bar input{min-width:0;flex:1;font-size:.72rem;padding:7px 8px}
  .search-bar select{flex-shrink:0;font-size:.72rem;padding:7px 6px;max-width:90px}
  .search-bar .btn{font-size:.72rem;padding:7px 10px;flex-shrink:0}
  .search-result{padding:8px 10px;gap:8px}
  .search-result .cover{width:36px;height:36px}
  .search-result .title{font-size:.78rem}
  .search-result .artist{font-size:.7rem}
  .btn{padding:7px 10px;font-size:.75rem}
  .btn-sm{padding:4px 6px;font-size:.68rem}
  .player-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;border-radius:0;margin:0;gap:6px;padding:8px 12px}
  .player-title{font-size:.72rem}
  .player-seek{flex:1}
  .player-time{font-size:.68rem}
  .btn-group{gap:4px;flex-wrap:wrap}
  .actions{display:block;border-top:1px solid var(--border);padding:10px;background:var(--bg-card);border-radius:var(--radius);margin-top:6px}
  .actions .btn-group{gap:4px;display:flex;flex-wrap:wrap;margin-top:6px}
  .actions .btn-group:first-child{margin-top:0}
  .actions .btn-group .btn{flex:1;min-width:0}
  .actions .btn{padding:6px 8px;font-size:.72rem}
}
</style>
</head>
<body>
<script>
/* Apply theme IMMEDIATELY before any rendering to prevent dark flash */
(function(){
  var t = localStorage.getItem("music-tag-theme");
  if (t === "light") { document.body.classList.add("light"); }
  else if (t === "dark") { /* dark is default — no class needed */ }
  else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
    document.body.classList.add("light");
  }
})();
</script>
<div class="app">
  <header class="header">
    <h1>🎵 Music Tag Editor</h1>
    <span style="flex:1"></span>
    <theme-button value="dark" size="1.5" id="themeBtn"></theme-button>
  </header>

  <div class="main">
    <!-- Left Panel: Upload & File List -->
    <aside class="upload-panel panel">
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 16V4m0 0L8 8m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
        </svg>
        <p>拖拽文件到此处 或 <span class="browse">点击浏览</span></p>
        <p class="format-hint">支持 MP3 / FLAC / M4A / OGG / WAV</p>
        <input type="file" id="fileInput" multiple accept=".mp3,.flac,.m4a,.mp4,.ogg,.wav,.wma,.ape" hidden>
      </div>

      <div class="file-list" id="fileList">
        <div class="file-list-header">
          <h3>文件列表 (<span id="fileCount">0</span>)</h3>
          <div class="file-list-actions">
            <button class="btn btn-secondary btn-sm" onclick="App.toggleSelectAll()" id="selectToggleBtn">☑ 全选</button>
            <button class="btn btn-secondary btn-sm" onclick="App.invertSelection()">↔ 反选</button>
            <button class="btn btn-secondary btn-sm" onclick="App.resetCurrent()">↻ 还原</button>
            <button class="btn btn-secondary btn-sm" onclick="App.clearSelected()" id="clearBtn" disabled>🗑 清除</button>
          </div>
        </div>
        <div id="fileItems"></div>
      </div>
    </aside>

    <!-- Right Panel: Editor -->
    <section class="editor-panel panel" id="editorPanel">
      <div class="editor-empty" id="editorEmpty">
        <p>请上传音乐文件开始编辑标签</p>
      </div>

      <div class="editor-content" id="editorContent" style="display:none">
        <div class="editor-header">
          <h2 id="currentFileName" style="flex:1;min-width:0;word-break:break-all;line-height:1.3">—</h2>
          <button class="btn btn-secondary" onclick="App.renameCurrent()" title="重命名下载文件名" style="white-space:nowrap;flex-shrink:0;padding:5px 10px;font-size:.78rem">✏️ 重命名</button>
        </div>

        <!-- Cover Row: matches editor-grid 2-col layout -->
        <div class="cover-row">
          <div class="cover-left">
            <div class="cover-preview" id="coverPreview">
              <span class="placeholder">无封面</span>
            </div>
            <div class="cover-actions">
              <div id="formatBadgeDisplay" class="format-badge">—</div>
              <div id="formatTagDisplay" class="audio-info-row">—</div>
              <button class="btn-cover" onclick="document.getElementById('coverFileInput').click()">📷 更换封面</button>
              <button class="btn-cover" onclick="App.removeCover()">✕ 移除封面</button>
              <input type="file" id="coverFileInput" accept="image/*" hidden onchange="App.onCoverFileSelected(this)">
            </div>
          </div>
          <!-- Player Panel (2nd column) -->
          <div class="player-panel" id="playerPanel" style="display:none;position:relative">
            <span class="player-panel-title" id="playerPanelTitle">—</span>
            <div class="player-row">
              <input type="range" class="player-seek" id="playerPanelSeek" min="0" max="100" value="0" title="进度">
              <span class="player-time" id="playerPanelTime">00:00 / 00:00</span>
            </div>
            <div class="player-row">
              <button class="player-btn-sm" id="btnPrev" title="上一首">⏮</button>
              <button class="player-btn-sm" id="playerPanelToggle" onclick="App.togglePlay()" title="播放/暂停">▶</button>
              <button class="player-btn-sm" id="btnNext" title="下一首">⏭</button>
            </div>
            <div class="player-extra-row">
              <button class="player-btn-sm" id="btnVolumeIcon" title="静音/有声" onclick="App.toggleMute()">🔊</button>
              <input type="range" class="volume-slider" id="playerPanelVolume" min="0" max="100" value="80" title="音量">
              <button class="player-btn-sm" id="btnLoop" title="列表循环" onclick="App.toggleLoop()">🔁</button>
              <button class="player-close-btn" onclick="App.closePlayer()" title="关闭播放器">✕</button>
            </div>
          </div>
        </div>
        <div class="editor-grid">
          <div class="form-group">
            <label>标题 Title</label>
            <input type="text" id="tagTitle" placeholder="歌曲标题">

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  ID3v2.3 Tag Reader / Writer  (browser-side, zero dependency)
// ═══════════════════════════════════════════════════════════════════════════

const ID3 = {};

/**
 * Read a synchsafe integer (4 bytes where each byte uses only 7 bits).
 */
ID3.readSynchSafe = function(view, offset) {
  return (view.getUint8(offset)     << 21) |
         (view.getUint8(offset + 1) << 14) |
         (view.getUint8(offset + 2) << 7)  |
         view.getUint8(offset + 3);
};

/**
 * Write a synchsafe integer.
 */
ID3.writeSynchSafe = function(value) {
  const buf = new Uint8Array(4);
  buf[0] = (value >> 21) & 0x7f;
  buf[1] = (value >> 14) & 0x7f;
  buf[2] = (value >> 7)  & 0x7f;
  buf[3] = value & 0x7f;
  return buf;
};

/**
 * Decode text from ID3v2 frame data.
 * Strategy: try UTF-8 first (most common), then declared encoding, then fallbacks.
 * This handles the common case where encoding byte is wrong but data is UTF-8.
 */
ID3.decodeText = function(data) {
  if (!data || data.length === 0) return "";
  const code = data[0];
  let bytes = data.slice(1);
  if (bytes.length === 0) return "";

  // Some encoders prepend an extra 0x00 before a UTF-16 BOM — strip it
  if (bytes.length >= 3 && bytes[0] === 0x00 &&
      ((bytes[1] === 0xFF && bytes[2] === 0xFE) || (bytes[1] === 0xFE && bytes[2] === 0xFF))) {
    bytes = bytes.slice(1);
  }

  // When encoding byte says UTF-16, trust it (avoid NUL-interleaved false UTF-8 decode)
  // Also try both LE and BE — some encoders write BE data with LE encoding byte.
  if (code === 0x01) {
    try {
      const leResult = new TextDecoder("utf-16").decode(bytes);
      if (!leResult.includes("\0")) return leResult;
      return new TextDecoder("utf-16be").decode(bytes);
    } catch (e) {}
  }
  if (code === 0x02) {
    try {
      const beResult = new TextDecoder("utf-16be").decode(bytes);
      if (!beResult.includes("\0")) return beResult;
      return new TextDecoder("utf-16").decode(bytes);
    } catch (e) {}
  }

  // Always try UTF-8 first — most modern MP3s use it regardless of encoding byte
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e) {}

  // UTF-8 didn't work — try the declared encoding
  try {
    if (code === 0x03) return new TextDecoder("utf-8").decode(bytes);
  } catch (e) {}

  // Try Chinese encodings
  try { return new TextDecoder("gbk", { fatal: true }).decode(bytes); } catch (e) {}
  try { return new TextDecoder("big5", { fatal: true }).decode(bytes); } catch (e) {}

  // Ultimate fallback: Latin-1 byte-by-byte
  let str = "";
  for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
  return str;
};

/**
 * Encode text for ID3v2 frame using UTF-8 (encoding byte 0x03).
 * Returns Uint8Array: [0x03, ...UTF-8 bytes].
 */
ID3.encodeText = function(text) {
  const utf8 = new TextEncoder().encode(text || "");
  const result = new Uint8Array(1 + utf8.length);
  result[0] = 0x03; // UTF-8
  result.set(utf8, 1);
  return result;
};

/**
 * Parse ID3v2 tags from an ArrayBuffer.
 * Returns { frames: { TIT2: "Title", TPE1: "Artist", ... }, cover: { mime, data } | null }
 * Returns null if no ID3v2 tag found.
 */
ID3.read = function(buffer) {
  if (!buffer || buffer.byteLength < 10) return null;

  const view = new DataView(buffer);
  const data = new Uint8Array(buffer);

  // Check ID3v2 signature
  if (data[0] !== 0x49 || data[1] !== 0x44 || data[2] !== 0x33) {
    return null; // "ID3"
  }

  const version = data[3];
  if (version < 2 || version > 4) return null; // Only v2.2-v2.4

  const flags = data[5];
  const hasFooter = !!(flags & 0x10); // v2.4 footer flag
  const hasExtended = !!(flags & 0x40); // Extended header present
  const tagSize = ID3.readSynchSafe(view, 6);

  let offset = 10; // After header

  // Skip extended header if present (v2.3 and v2.4)
  if (hasExtended) {
    // Extended header: 4-byte synchsafe size (does NOT include these 4 bytes in v2.3)
    const extSize = ID3.readSynchSafe(view, offset);
    offset += 4;
    if (version === 4) {
      // In v2.4, size includes the 4 bytes we just read
      offset += Math.max(0, extSize - 4);
    } else {
      offset += extSize;
    }
  }

  const tagEnd = offset + tagSize;

  const result = { frames: {}, cover: null, tagSize: tagSize + 10 + (hasFooter ? 10 : 0), version };

  // Iterate frames
  while (offset < tagEnd - 10) {
    // v2.2 uses 3-byte frame IDs, v2.3/v2.4 use 4-byte
    const frameId = version === 2
      ? String.fromCharCode(data[offset], data[offset + 1], data[offset + 2])
      : String.fromCharCode(data[offset], data[offset + 1], data[offset + 2], data[offset + 3]);

    // Stop at padding (null frame ID)
    if (frameId.charCodeAt(0) === 0) break;

    let frameSize, frameFlags;

    if (version === 2) {
      // ID3v2.2: 3-byte frame ID (already read at offset..offset+2), 3-byte size at offset+3..offset+5
      frameSize = (data[offset + 3] << 16) | (data[offset + 4] << 8) | data[offset + 5];
      frameFlags = 0;
      offset += 6; // Skip past 3-byte ID + 3-byte size
    } else {
      // ID3v2.3/2.4: 4-byte frame ID, 4-byte size, 2-byte flags (ID was read from bytes before offset)
      frameSize = (version === 4)
        ? ID3.readSynchSafe(view, offset + 4)
        : view.getUint32(offset + 4);
      frameFlags = view.getUint16(offset + 8);
      offset += 10;
    }

    // Zero or negative size = skip
    if (frameSize <= 0) break;

    const frameData = data.slice(offset, offset + frameSize);
    offset += frameSize;

    // Extract frame content
    if (frameId === "APIC" || frameId === "PIC") {
      // Attached picture
      try {
        const enc = frameData[0];
        let pos = 1;

        // MIME type
        let mime = "";
        while (pos < frameData.length && frameData[pos] !== 0) {
          mime += String.fromCharCode(frameData[pos]);
          pos++;
        }
        pos++; // Skip null

        // Picture type (skip)
        pos++; // picType = frameData[pos];

        // Description
        while (pos < frameData.length && frameData[pos] !== 0) pos++;
        pos++; // Skip null

        // Image data
        const imgData = frameData.slice(pos);
        result.cover = {
          mime: mime || "image/jpeg",
          data: imgData
        };
        // Preserve raw frame for lossless re-write
        result._coverFrameData = frameData;
      } catch (e) { /* ignore malformed APIC */ }
    } else if (frameId === "TIT2" || frameId === "TT2") {
      result.frames.title = ID3.decodeText(frameData);
    } else if (frameId === "TPE1" || frameId === "TP1") {
      result.frames.artist = ID3.decodeText(frameData);
    } else if (frameId === "TALB" || frameId === "TAL") {
      result.frames.album = ID3.decodeText(frameData);
    } else if (frameId === "TYER" || frameId === "TYE" || frameId === "TDRC") {
      result.frames.year = ID3.decodeText(frameData);
    } else if (frameId === "TRCK" || frameId === "TRK") {
      result.frames.track = ID3.decodeText(frameData);
    } else if (frameId === "TCON" || frameId === "TCO") {
      result.frames.genre = ID3.decodeText(frameData);
    } else if (frameId === "COMM" || frameId === "COM") {
      // COMM: encoding(1)+lang(3)+desc(null)+text
      let descEnd = 4;
      while (descEnd < frameData.length && frameData[descEnd] !== 0) descEnd++;
      if (descEnd + 1 < frameData.length) {
        result.frames.comment = ID3.decodeAny(frameData.slice(descEnd + 1));
      }
    } else if (frameId === "TPOS" || frameId === "TPA") {
      result.frames.disc = ID3.decodeText(frameData);       // "1/2" format
    } else if (frameId === "TCOM" || frameId === "TCM") {
      result.frames.composer = ID3.decodeText(frameData);
    } else if (frameId === "TPE2" || frameId === "TP2") {
      result.frames.albumArtist = ID3.decodeText(frameData);
    } else if (frameId === "USLT" || frameId === "ULT") {
      // USLT: encoding(1)+lang(3)+desc(null)+lyrics
      const encByte = frameData[0];
      let descEnd = 4;
      while (descEnd < frameData.length && frameData[descEnd] !== 0) descEnd++;
      if (descEnd + 1 < frameData.length) {
        result.frames.lyrics = ID3.decodeAny(frameData.slice(descEnd + 1), encByte);
      }
    } else if (frameId === "TXXX" || frameId === "TXX") {
      // Custom text frame: encoding(1)+desc(null)+value
      let dEnd = 1;
      while (dEnd < frameData.length && frameData[dEnd] !== 0) dEnd++;
      if (dEnd + 1 < frameData.length) {
        const desc = ID3.decodeAny(frameData.slice(1, dEnd));
        const val = ID3.decodeAny(frameData.slice(dEnd + 1));
        if (desc.toUpperCase() === "LYRICS" || desc.toUpperCase() === "UNSYNCEDLYRICS") {
          if (!result.frames.lyrics) result.frames.lyrics = val;
        }
      }
    } else if (frameId === "SYLT") {
      // Synchronized lyrics: skip timing and just extract text
      // SYLT: encoding(1)+lang(3)+timestamp(1)+type(1)+count(4)+descriptor(null)+pairs...
      // For now just signal presence
      result.frames._hasSYLT = true;
    }
  }

  return result;
};

/**
 * Universal text decoder — tries UTF-8, detects BOM for UTF-16, then GBK/Big5/Latin-1.
 * No reliance on encoding byte. Handles all real-world cases.
 * @param {Uint8Array} bytes - Raw bytes to decode
 * @param {number} [encByte] - Optional ID3 encoding byte (0x00=Latin1, 0x01=UTF16LE, 0x02=UTF16BE, 0x03=UTF8)
 */
ID3.decodeAny = function(bytes, encByte) {
  if (!bytes || bytes.length === 0) return "";

  // Some encoders prepend an extra 0x00 before a UTF-16 BOM — strip it
  if (bytes.length >= 3 && bytes[0] === 0x00 &&
      ((bytes[1] === 0xFF && bytes[2] === 0xFE) || (bytes[1] === 0xFE && bytes[2] === 0xFF))) {
    bytes = bytes.slice(1);
  }

  // When encoding byte explicitly indicates UTF-16, try UTF-16 before UTF-8
  // to avoid the "UTF-8 succeeds on NUL-interleaved UTF-16LE data" issue.
  // Also try both LE and BE — some encoders write BE data with LE encoding byte.
  if (encByte === 0x01) {
    try {
      if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE)
        return new TextDecoder("utf-16").decode(bytes);
      if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF)
        return new TextDecoder("utf-16be").decode(bytes);
      // No BOM: try LE first (per ID3v2 spec)
      const leResult = new TextDecoder("utf-16").decode(bytes);
      // Check if the result looks reasonable (not all CJK when the file title is English)
      const hasNul = leResult.includes("\0");
      if (!hasNul) return leResult;
      // Has NUL interleaved - probably wrong endianness, try BE
      return new TextDecoder("utf-16be").decode(bytes);
    } catch (e) { /* fall through */ }
  }
  if (encByte === 0x02) {
    try {
      if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF)
        return new TextDecoder("utf-16be").decode(bytes);
      if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE)
        return new TextDecoder("utf-16").decode(bytes);
      // No BOM: try BE first
      const beResult = new TextDecoder("utf-16be").decode(bytes);
      const hasNul = beResult.includes("\0");
      if (!hasNul) return beResult;
      return new TextDecoder("utf-16").decode(bytes);
    } catch (e) { /* fall through */ }
  }

  // Default: UTF-8 first (covers most modern MP3s regardless of wrong encoding byte),
  // then BOM detection, then Chinese encodings, then Latin-1 fallback
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e) {}
  if (bytes.length >= 2) {
    if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder("utf-16").decode(bytes);
    if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder("utf-16be").decode(bytes);
  }
  try { return new TextDecoder("gbk", { fatal: true }).decode(bytes); } catch (e) {}
  try { return new TextDecoder("big5", { fatal: true }).decode(bytes); } catch (e) {}
  let str2 = "";
  for (let i = 0; i < bytes.length; i++) str2 += String.fromCharCode(bytes[i]);
  return str2;
};

/**
 * Write ID3v2.3 tags to an ArrayBuffer.
 * @param {ArrayBuffer} buffer - Original file buffer
 * @param {object} tags - { title, artist, album, year, track, genre, comment }
 * @param {object} originalId3 - Result from ID3.read() to get original tag size
 * @returns {ArrayBuffer} - New buffer with updated ID3 tag
 */
ID3.write = function(buffer, tags, originalId3) {
  const data = new Uint8Array(buffer);

  // Collect frames to write
  const frames = [];
  if (tags.title)       frames.push(ID3._makeFrame("TIT2", tags.title));
  if (tags.artist)      frames.push(ID3._makeFrame("TPE1", tags.artist));
  if (tags.albumArtist) frames.push(ID3._makeFrame("TPE2", tags.albumArtist));
  if (tags.composer)    frames.push(ID3._makeFrame("TCOM", tags.composer));
  if (tags.album)       frames.push(ID3._makeFrame("TALB", tags.album));
  if (tags.year)        frames.push(ID3._makeFrame("TYER", tags.year));
  if (tags.track)       frames.push(ID3._makeFrame("TRCK", tags.track));
  if (tags.disc)        frames.push(ID3._makeFrame("TPOS", tags.disc));
  if (tags.genre)       frames.push(ID3._makeFrame("TCON", tags.genre));
  if (tags.comment)     frames.push(ID3._makeFrame("COMM", tags.comment));
  if (tags.lyrics)      frames.push(ID3._makeLyricsFrame("USLT", tags.lyrics));

  // Cover art: use new cover if provided, otherwise passthrough original
  if (tags._newCover) {
    // New cover provided as { mime, data: Uint8Array }
    frames.push(ID3._makeCoverFrame("APIC", tags._newCover.mime, tags._newCover.data));
  } else if (tags._removeCover) {
    // Explicitly removed cover — don't include APIC frame
  } else if (originalId3 && originalId3._coverFrameData && originalId3.version >= 3) {
    // Passthrough original cover (v2.3+ APIC format)
    frames.push(ID3._wrapRawFrame("APIC", originalId3._coverFrameData));
  } else if (originalId3 && originalId3._coverFrameData && originalId3.version < 3) {
    // v2.2 PIC → convert to v2.3 APIC: map 3-byte MIME to standard format
    const picData = originalId3._coverFrameData;
    if (picData.length >= 5) {
      const mime3 = String.fromCharCode(picData[1], picData[2], picData[3]);
      const mimeFull = mime3 === "JPG" ? "image/jpeg" : mime3 === "PNG" ? "image/png" : "image/jpeg";
      let descEnd = 5;
      while (descEnd < picData.length && picData[descEnd] !== 0) descEnd++;
      const imgData = picData.slice(descEnd + 1);
      if (imgData.length > 0) {
        frames.push(ID3._makeCoverFrame("APIC", mimeFull, imgData));
      }
    }
  }

  // Calculate total frame size
  let framesSize = 0;
  for (const f of frames) framesSize += f.length;

  // Add 1024 bytes padding
  const paddingSize = 1024;
  const tagBodySize = framesSize + paddingSize;

  // Create ID3v2.3 header (10 bytes)
  const header = new Uint8Array(10);
  header[0] = 0x49; header[1] = 0x44; header[2] = 0x33; // "ID3"
  header[3] = 0x03; header[4] = 0x00; // Version 2.3
  header[5] = 0x00; // Flags
  const sizeBytes = ID3.writeSynchSafe(tagBodySize);
  header.set(sizeBytes, 6);

  // Build new tag
  const newTag = new Uint8Array(10 + framesSize + paddingSize);
  newTag.set(header, 0);
  let pos = 10;
  for (const f of frames) {
    newTag.set(f, pos);
    pos += f.length;
  }
  // Padding (zeros)
  for (let i = pos; i < newTag.length; i++) newTag[i] = 0;

  // Determine audio start
  let audioStart = 0;
  if (originalId3 && originalId3.tagSize > 0) {
    audioStart = originalId3.tagSize;
  }

  const audioData = data.slice(audioStart);
  const result = new Uint8Array(newTag.length + audioData.length);
  result.set(newTag);
  result.set(audioData, newTag.length);

  return result.buffer;
};

/**
 * Make a single ID3v2.3 frame (10-byte header + body).
 */
ID3._makeFrame = function(id, value) {
  const body = ID3.encodeText(value);
  // For COMM frame, prepend language + description (no extra encoding byte in text)
  let frameBody;
  if (id === "COMM") {
    // encoding(1) + "eng"(3) + null-short-desc(1) + raw UTF-8 text
    const utf8 = new TextEncoder().encode(value || "");
    frameBody = new Uint8Array(5 + utf8.length);
    frameBody[0] = 0x03; // UTF-8 encoding
    frameBody[1] = 0x65; frameBody[2] = 0x6e; frameBody[3] = 0x67; // "eng"
    frameBody[4] = 0x00; // empty short description
    frameBody.set(utf8, 5);
  } else {
    frameBody = body;
  }

  const frame = new Uint8Array(10 + frameBody.length);
  // Frame ID
  for (let i = 0; i < 4; i++) frame[i] = id.charCodeAt(i);
  // Size (not synchsafe for v2.3)
  const size = frameBody.length;
  frame[4] = (size >> 24) & 0xff;
  frame[5] = (size >> 16) & 0xff;
  frame[6] = (size >> 8)  & 0xff;
  frame[7] = size & 0xff;
  // Flags = 0
  frame[8] = 0; frame[9] = 0;
  // Body
  frame.set(frameBody, 10);

  return frame;
};

/**
 * Wrap raw frame data (from previously parsed frame) into a full frame
 * with 10-byte header. Used for passthrough of cover art and other binary frames.
 */
ID3._wrapRawFrame = function(id, rawData) {
  const frame = new Uint8Array(10 + rawData.length);
  for (let i = 0; i < 4; i++) frame[i] = id.charCodeAt(i);
  const size = rawData.length;
  frame[4] = (size >> 24) & 0xff;
  frame[5] = (size >> 16) & 0xff;
  frame[6] = (size >> 8)  & 0xff;
  frame[7] = size & 0xff;
  frame[8] = 0; frame[9] = 0;
  frame.set(rawData, 10);
  return frame;
};

/**
 * Build a USLT (lyrics) frame.
 * Format: encoding(1) + "eng"(3) + short_desc(1+null) + lyrics
 * Unlike COMM, USLT text area does not have its own encoding byte.
 */
ID3._makeLyricsFrame = function(id, text) {
  const utf8 = new TextEncoder().encode(text || "");
  // encoding(1) + language(3) + null desc(1) + utf8 lyrics
  const frameBody = new Uint8Array(5 + utf8.length);
  frameBody[0] = 0x03; // UTF-8
  frameBody[1] = 0x65; frameBody[2] = 0x6e; frameBody[3] = 0x67; // "eng"
  frameBody[4] = 0x00; // empty content descriptor
  frameBody.set(utf8, 5);

  const frame = new Uint8Array(10 + frameBody.length);
  for (let i = 0; i < 4; i++) frame[i] = id.charCodeAt(i);
  const size = frameBody.length;
  frame[4] = (size >> 24) & 0xff;
  frame[5] = (size >> 16) & 0xff;
  frame[6] = (size >> 8)  & 0xff;
  frame[7] = size & 0xff;
  frame[8] = 0; frame[9] = 0;
  frame.set(frameBody, 10);
  return frame;
};

/**
 * Build an APIC (cover art) frame from raw image data.
 * Format: encoding(0x03=UTF8) + mimeType(null) + picType(0x03=cover) + desc(null) + imageBytes
 */
ID3._makeCoverFrame = function(id, mimeType, imageData) {
  const mimeBytes = new TextEncoder().encode(mimeType || "image/jpeg");
  const imgBytes = imageData instanceof Uint8Array ? imageData : new Uint8Array(imageData);
  const frameBody = new Uint8Array(1 + mimeBytes.length + 1 + 1 + 1 + imgBytes.length);
  let pos = 0;
  frameBody[pos++] = 0x03; // UTF-8 encoding byte
  frameBody.set(mimeBytes, pos); pos += mimeBytes.length;
  frameBody[pos++] = 0x00; // null terminator
  frameBody[pos++] = 0x03; // picture type: Cover (front)
  frameBody[pos++] = 0x00; // empty description (null)
  frameBody.set(imgBytes, pos);

  const frame = new Uint8Array(10 + frameBody.length);
  for (let i = 0; i < 4; i++) frame[i] = id.charCodeAt(i);
  const size = frameBody.length;
  frame[4] = (size >> 24) & 0xff;
  frame[5] = (size >> 16) & 0xff;
  frame[6] = (size >> 8)  & 0xff;
  frame[7] = size & 0xff;
  frame[8] = 0; frame[9] = 0;
  frame.set(frameBody, 10);
  return frame;
};


// ═══════════════════════════════════════════════════════════════════════════
//  FLAC Vorbis Comment Reader / Writer (browser-side)
// ═══════════════════════════════════════════════════════════════════════════

const FLAC = {};

FLAC.read = function(buffer) {
  if (!buffer || buffer.byteLength < 8) return null;
  const data = new Uint8Array(buffer);
  if (String.fromCharCode(data[0], data[1], data[2], data[3]) !== "fLaC") return null;

  FLAC._lastPicture = null; // Reset
  let offset = 4, lastBlock = false, blocks = [], vc = null, streamInfo = null;
  while (!lastBlock && offset + 4 <= data.length) {
    const h = data[offset], isLast = !!(h & 0x80), type = h & 0x7f;
    const sz = (data[offset + 1] << 16) | (data[offset + 2] << 8) | data[offset + 3];
    const start = offset; offset += 4;
    if (sz <= 0 || offset + sz > data.length) break;
    blocks.push({ type, start, size: 4 + sz, lastBlock: isLast });
    if (type === 0 && sz >= 18) { // STREAMINFO — extract audio properties
      const raw = data.slice(offset, offset + sz);
      const sampleRate = (raw[10] << 12) | (raw[11] << 4) | (raw[12] >>> 4);
      const channels = ((raw[12] & 0x0E) >>> 1) + 1;
      const bitDepth = ((raw[12] & 0x01) << 4) | (raw[13] >>> 4) + 1;
      streamInfo = { sampleRate, channels, bitDepth };
    }
    if (type === 4) vc = FLAC._parseVC(data, offset, sz, blocks, start);
    if (type === 6) { // PICTURE block
      FLAC._parsePicture(data, offset, sz);
      blocks[blocks.length - 1]._isPicture = true;
    }
    offset += sz; lastBlock = isLast;
  }
  // CRITICAL: Preserve audio frame data that follows the last metadata block
  const audioData = offset < data.length ? data.slice(offset) : null;
  if (!vc) return { blocks, metadata: {}, cover: FLAC._lastPicture, isFLAC: true, audioData, streamInfo };
  const metadata = {};
  for (const f of vc.fields) {
    const eq = f.indexOf("="); if (eq < 0) continue;
    const k = f.slice(0, eq).toUpperCase(), v = f.slice(eq + 1);
    const map = { TITLE: "title", ARTIST: "artist", ALBUMARTIST: "albumArtist", ALBUM: "album",
      DATE: "year", YEAR: "year", TRACKNUMBER: "track", DISCNUMBER: "disc", GENRE: "genre",
      COMPOSER: "composer", COMMENT: "comment", LYRICS: "lyrics" };
    if (map[k]) metadata[map[k]] = v;
  }
  return { blocks, metadata, vorbisComment: vc, cover: FLAC._lastPicture, isFLAC: true, audioData, streamInfo };
};

FLAC._parseVC = function(data, offset, sz, blocks, blockStart) {
  const v = new DataView(data.buffer, data.byteOffset, data.byteLength);
  let p = offset, vendorLen = v.getUint32(p, true); p += 4;
  const vendor = new TextDecoder("utf-8").decode(data.slice(p, p + vendorLen)); p += vendorLen;
  const count = v.getUint32(p, true); p += 4, fields = [];
  for (let i = 0; i < count; i++) {
    const len = v.getUint32(p, true); p += 4;
    fields.push(new TextDecoder("utf-8", { fatal: true }).decode(data.slice(p, p + len))); p += len;
  }
  return { vendor, count, fields, blockIndex: blocks.length - 1, blockStart, blockSize: 4 + sz, rawStart: offset };
};

/** Parse FLAC PICTURE metadata block to extract cover art */
FLAC._parsePicture = function(data, offset, size) {
  try {
    let p = offset;
    const type = (data[p] << 24) | (data[p + 1] << 16) | (data[p + 2] << 8) | data[p + 3]; p += 4;
    const mimeLen = (data[p] << 24) | (data[p + 1] << 16) | (data[p + 2] << 8) | data[p + 3]; p += 4;
    const mime = new TextDecoder("utf-8").decode(data.slice(p, p + mimeLen)); p += mimeLen;
    const descLen = (data[p] << 24) | (data[p + 1] << 16) | (data[p + 2] << 8) | data[p + 3]; p += 4;
    p += descLen; // Skip description
    const width = (data[p] << 24) | (data[p + 1] << 16) | (data[p + 2] << 8) | data[p + 3]; p += 4;
    const height = (data[p] << 24) | (data[p + 1] << 16) | (data[p + 2] << 8) | data[p + 3]; p += 4;
    const depth = (data[p] << 24) | (data[p + 1] << 16) | (data[p + 2] << 8) | data[p + 3]; p += 4;
    const colors = (data[p] << 24) | (data[p + 1] << 16) | (data[p + 2] << 8) | data[p + 3]; p += 4;
    const picLen = (data[p] << 24) | (data[p + 1] << 16) | (data[p + 2] << 8) | data[p + 3]; p += 4;
    const picData = data.slice(p, p + picLen);
    FLAC._lastPicture = { mime: mime || "image/jpeg", data: picData, width, height };
  } catch (e) { FLAC._lastPicture = null; }
};

FLAC.write = function(buffer, tags, flacInfo) {
  if (!flacInfo || !flacInfo.vorbisComment) return buffer;
  const data = new Uint8Array(buffer), vc = flacInfo.vorbisComment, blocks = flacInfo.blocks;

  // Build new Vorbis Comment block
  const comments = [];
  const addC = (k, v) => { if (v) comments.push(k + "=" + v); };
  addC("TITLE", tags.title); addC("ARTIST", tags.artist); addC("ALBUMARTIST", tags.albumArtist);
  addC("ALBUM", tags.album); addC("DATE", tags.year); addC("TRACKNUMBER", tags.track);
  addC("DISCNUMBER", tags.disc); addC("GENRE", tags.genre); addC("COMPOSER", tags.composer);
  addC("COMMENT", tags.comment); addC("LYRICS", tags.lyrics);
  const managed = ["TITLE","ARTIST","ALBUMARTIST","ALBUM","DATE","YEAR","TRACKNUMBER","DISCNUMBER","GENRE","COMPOSER","COMMENT","LYRICS"];
  for (const f of vc.fields) if (!managed.includes(f.split("=")[0])) comments.push(f);
  const vendorBytes = new TextEncoder().encode(vc.vendor || "reference libFLAC 1.3.2 20170101");
  const cbs = comments.map(c => new TextEncoder().encode(c));
  let vcSz = 4 + vendorBytes.length + 4; for (const cb of cbs) vcSz += 4 + cb.length;
  const vcBlock = new Uint8Array(4 + vcSz), dvVC = new DataView(vcBlock.buffer);
  vcBlock[0] = 0x04; vcBlock[1] = (vcSz >> 16) & 0xff; vcBlock[2] = (vcSz >> 8) & 0xff; vcBlock[3] = vcSz & 0xff;
  let vp = 4; dvVC.setUint32(vp, vendorBytes.length, true); vp += 4;
  vcBlock.set(vendorBytes, vp); vp += vendorBytes.length;
  dvVC.setUint32(vp, comments.length, true); vp += 4;
  for (const cb of cbs) { dvVC.setUint32(vp, cb.length, true); vp += 4; vcBlock.set(cb, vp); vp += cb.length; }

  // Build PICTURE block if cover is provided
  let picBlock = null;
  const cov = tags._newCover;
  if (cov && cov.data && cov.data.length > 0) {
    const mimeB = new TextEncoder().encode(cov.mime || "image/jpeg");
    const imgD = cov.data instanceof Uint8Array ? cov.data : new Uint8Array(cov.data);
    const picSz = 4+4+mimeB.length+4+0+4+4+4+4+4+imgD.length;
    picBlock = new Uint8Array(4 + picSz);
    const dvP = new DataView(picBlock.buffer);
    picBlock[0] = 0x06; picBlock[1] = (picSz>>16)&0xff; picBlock[2] = (picSz>>8)&0xff; picBlock[3] = picSz&0xff;
    let pp = 4;
    dvP.setUint32(pp, 3, false); pp += 4;
    dvP.setUint32(pp, mimeB.length, false); pp += 4; picBlock.set(mimeB, pp); pp += mimeB.length;
    dvP.setUint32(pp, 0, false); pp += 4;
    dvP.setUint32(pp, 0, false); pp += 4;
    dvP.setUint32(pp, 0, false); pp += 4;
    dvP.setUint32(pp, 24, false); pp += 4;
    dvP.setUint32(pp, 0, false); pp += 4;
    dvP.setUint32(pp, imgD.length, false); pp += 4;
    picBlock.set(imgD, pp);
  }

  // Determine intent: keep existing cover, replace, or remove
  const keepCover = !tags._removeCover && !tags._newCover;

  // Assemble: replace old VC + PICTURE blocks with new ones
  const parts = [];
  let replaced = false;
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    const isVCBlock = (i === vc.blockIndex);
    const isPicBlock = (b.type === 6 || b._isPicture);

    if (isVCBlock) {
      // Replace old Vorbis Comment with new one
      if (!replaced) {
        parts.push(vcBlock);
        // Insert new PICTURE block right after VC
        if (picBlock) parts.push(picBlock);
        replaced = true;
      }
      continue; // Skip old VC block
    }

    if (isPicBlock) {
      if (keepCover && !replaced) {
        // Keep old PICTURE block as-is (no VC change yet — keepCover + VC at different index)
        parts.push(data.slice(b.start, b.start + b.size));
      } else if (keepCover && replaced) {
        // Already replaced VC, but keepCover → keep old picture
        parts.push(data.slice(b.start, b.start + b.size));
      }
      // else (_removeCover or _newCover): skip old PICTURE (it's already been replaced above)
      continue;
    }

    // Keep all other blocks
    parts.push(data.slice(b.start, b.start + b.size));
  }
  // If replaced is still false (shouldn't happen), add at end
  if (!replaced) {
    parts.push(vcBlock);
    if (picBlock) parts.push(picBlock);
  }

  // Reset all last-block flags, then set on the actual last block
  for (let p = 0; p < parts.length; p++) {
    parts[p][0] &= 0x7F; // Clear last-block bit
  }
  if (parts.length > 0) {
    parts[parts.length - 1][0] |= 0x80; // Set on last block
  }

  // Assemble final buffer — fLaC marker + metadata blocks + audio frames
  // CRITICAL: must include "fLaC" magic bytes, otherwise FLAC.read() fails
  // and the file is unplayable (media players require this marker)
  const fLaC = new Uint8Array([0x66, 0x4C, 0x61, 0x43]); // "fLaC"
  const total = 4 + parts.reduce((s, p) => s + p.length, 0) + (flacInfo.audioData ? flacInfo.audioData.length : 0);
  const result = new Uint8Array(total);
  let rp = 0;
  result.set(fLaC, rp); rp += 4;
  for (const p of parts) { result.set(p, rp); rp += p.length; }
  // Append audio frame data (CRITICAL: without this the FLAC file has no sound)
  if (flacInfo.audioData && flacInfo.audioData.length > 0) {
    result.set(flacInfo.audioData, rp);
  }
  return result.buffer;
};

/** Parse MP3/MPEG audio info: scan for first sync frame, extract bitrate + sample rate */
ID3._parseMP3Info = function(buffer) {
  try {
    const data = new Uint8Array(buffer);
    // Skip ID3v2 tag header if present
    let start = 0;
    if (data.length > 9 && data[0] === 0x49 && data[1] === 0x44 && data[2] === 0x33) {
      start = 10 + ((data[6] << 21) | (data[7] << 14) | (data[8] << 7) | data[9]);
    }
    // MPEG1 Layer3 bitrate table (kbps) indexed by [versionIdx][layerIdx][bitrateIdx]
    const brTable = [
      // MPEG1
      [[0,32,64,96,128,160,192,224,256,288,320,352,384,416,448,0],
       [0,32,48,56, 64, 80, 96,112,128,160,192,224,256,320,384,0],
       [0,32,40,48, 56, 64, 80, 96,112,128,160,192,224,256,320,0]],
      // MPEG2/2.5
      [[0,32,48,56,64,80,96,112,128,144,160,176,192,224,256,0],
       [0, 8,16,24,32,40,48, 56, 64, 80, 96,112,128,144,160,0],
       [0, 8,16,24,32,40,48, 56, 64, 80, 96,112,128,144,160,0]]
    ];
    const srTable = [[44100,48000,32000],[22050,24000,16000],[11025,12000,8000]];
    const skip = Math.min(data.length, start + 32 * 1024);
    for (let i = start; i < skip - 1; i++) {
      if (data[i] !== 0xFF || (data[i+1] & 0xE0) !== 0xE0) continue;
      const b = data[i+1];
      const verIdx = (b & 0x18) === 0x18 ? 0 : (b & 0x08) ? 1 : 2;
      const layerIdx = 3 - ((b & 0x06) >>> 1);
      if (layerIdx < 0 || layerIdx > 2) continue;
      const brIdx = (data[i+2] & 0xF0) >>> 4;
      if (brIdx === 0 || brIdx === 15) continue;
      const srIdx = (data[i+2] & 0x0C) >>> 2;
      if (srIdx === 3) continue;
      const bitrate = brTable[verIdx === 0 ? 0 : 1][layerIdx][brIdx];
      const sampleRate = srTable[verIdx][srIdx];
      const channels = (b & 0x06) === 0x06 ? 1 : 2;
      if (bitrate > 0) return { bitrate, sampleRate, channels };
    }
  } catch(e) {}
  return null;
};


// ═══════════════════════════════════════════════════════════════════════════
//  Application State & Logic
// ═══════════════════════════════════════════════════════════════════════════

const App = {
  files: new Map(),      // fileId → { id, file, buffer, metadata, id3, modified }
  selectedId: null,      // Currently selected file ID
  searchResults: [],     // Search results cache
  _searchPage: 0,        // Current page of search results
  _searchPageSize: 5,    // Results per page

  /** Initialize after DOM is ready */
  init() {
    this.setupDropzone();
    this.setupKeyboard();
    this.initTheme();
    this.setupPlayer();
  },

  /** Bind player controls */
  setupPlayer() {
    const audio = document.getElementById("playerAudio");
    // Mobile controls
    const toggle = document.getElementById("playToggle");
    const close = document.getElementById("playClose");
    const seek = document.getElementById("playSeek");
    const time = document.getElementById("playTime");
    // Desktop panel controls
    const pSeek = document.getElementById("playerPanelSeek");
    const pTime = document.getElementById("playerPanelTime");

    toggle.onclick = () => this.togglePlay();
    close.onclick = () => this.closePlayer();
    // Desktop panel buttons
    (document.getElementById("btnPrev")||{}).onclick = () => this.prevTrack();
    (document.getElementById("btnNext")||{}).onclick = () => this.nextTrack();

    const updateUI = () => {
      if (!audio.duration) return;
      const val = (audio.currentTime / audio.duration) * 100;
      const txt = this._fmtTime(audio.currentTime) + " / " + this._fmtTime(audio.duration);
      seek.value = val; time.textContent = txt;
      if (pSeek) pSeek.value = val;
      if (pTime) pTime.textContent = txt;
      // Update title with current lyrics line (follows playing track, not selected tab)
      const pTitle = document.getElementById("playerPanelTitle");
      if (pTitle) {
        const playingEntry = this._playingId ? this.files.get(this._playingId) : null;
        const lyricsText = playingEntry ? (playingEntry.metadata.lyrics || "") : "";
        const line = this._getLyricLine(lyricsText, audio.currentTime);
        const fallback = playingEntry ? (playingEntry._displayName || playingEntry.file.name) : "—";
        pTitle.textContent = line || fallback;
      }
    };

    audio.ontimeupdate = updateUI;
    audio.onloadedmetadata = () => {
      time.textContent = "00:00 / " + this._fmtTime(audio.duration);
      if (pTime) pTime.textContent = time.textContent;
    };
    audio.onended = () => {
      (window.innerWidth <= 768 ? document.getElementById("playToggle") : document.getElementById("playerPanelToggle")).textContent = "▶";
      seek.value = 0; time.textContent = "00:00 / " + this._fmtTime(audio.duration);
      if (pSeek) pSeek.value = 0;
      if (pTime) pTime.textContent = time.textContent;
    };

    seek.oninput = () => { if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration; };
    if (pSeek) pSeek.oninput = () => { if (audio.duration) audio.currentTime = (pSeek.value / 100) * audio.duration; };

    // Volume control
    const vol = document.getElementById("playerPanelVolume");
    if (vol) vol.oninput = () => { audio.volume = vol.value / 100; };
  },

  _fmtTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  },

  async _sha256(buffer) {
    const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  },

  /** Parse LRC lyrics and return the line matching current time, or empty string if none */
  _getLyricLine(lyricsText, currentSec) {
    if (!lyricsText) return "";
    const lines = lyricsText.split("\n");
    if (!lines.length) return "";
    let lastLine = "";
    for (const line of lines) {
      const m = line.match(/^\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]\s*(.*)/);
      if (!m) continue;
      const min = parseInt(m[1], 10);
      const sec = parseInt(m[2], 10);
      const ms = m[3] ? parseInt(m[3].padEnd(3, "0"), 10) / 1000 : 0;
      const ts = min * 60 + sec + ms;
      if (ts <= currentSec) lastLine = m[4] || "";
      else break;
    }
    return lastLine;
  },



  /** Sync theme-button value to match body state */
  initTheme() {
    const btn = document.getElementById("themeBtn");
    if (!btn) return;
    const isLight = document.body.classList.contains("light");
    btn.setAttribute("value", isLight ? "light" : "dark");
  },

  /** Toggle: select all files if none/all selected, deselect all if some selected */
  toggleSelectAll() {
    const all = this.files.size > 0 && [...this.files.values()].every(e => e._selected);
    for (const [id, entry] of this.files) {
      entry._selected = !all;
    }
    this.renderFileList();
  },
  /** Invert: selected ↔ unselected */
  invertSelection() {
    for (const [id, entry] of this.files) {
      entry._selected = !entry._selected;
    }
    this.renderFileList();
  },
  /** Batch: rename downloaded files to "Artist - Title.ext" or "Title - Artist.ext" */
  batchRename(format) {
    let count = 0;
    for (const [id, entry] of this.files) {
      if (!entry._selected) continue;
      const artist = entry.metadata.artist || "Unknown";
      const title = entry.metadata.title || entry.file.name.replace(/\.[^.]+$/, "");
      const ext = entry.file.name.split(".").pop();
      if (format === "artist-title") {
        entry._downloadName = `${artist} - ${title}.${ext}`;
      } else {
        entry._downloadName = `${title} - ${artist}.${ext}`;
      }
      // Store display name so renderEditor shows the new name
      entry._displayName = entry._downloadName;
      count++;
    }
    this.renderFileList();
    this.renderEditor();
    this.toast(`已设置 ${count} 个文件的重命名`, "success");
  },
  /** Batch: save all selected files */
  batchSave() {
    let count = 0, failed = 0;
    for (const [id, entry] of this.files) {
      if (!entry._selected) continue;
      if (!this._isWritable(entry)) { failed++; continue; }
      try {
        const isFLAC = entry.flacInfo && entry.flacInfo.isFLAC;
        if (isFLAC) {
          entry.buffer = FLAC.write(entry.buffer, entry.metadata, entry.flacInfo);
          entry.flacInfo = FLAC.read(entry.buffer);
        } else {
          entry.buffer = ID3.write(entry.buffer, entry.metadata, entry.id3);
          entry.id3 = ID3.read(entry.buffer);
        }
        entry.modified = true;
        count++;
      } catch(e) { failed++; }
    }
    this.renderFileList();
    this.renderEditor();
    this.toast(`批量保存: ${count} 成功, ${failed} 失败`, count > 0 ? "success" : "error");
  },
  /** Batch: download all selected files */
  async batchDownload() {
    // Auto-save unsaved changes in current file before batch download
    if (this.selectedId) {
      const curEntry = this.files.get(this.selectedId);
      if (curEntry && curEntry._selected && this._hasUnsavedChanges(curEntry)) {
        this.saveCurrent();
      }
    }

    let count = 0, failed = 0;
    for (const [id, entry] of this.files) {
      if (!entry._selected) continue;
      if (!entry.buffer) { failed++; continue; }
      try {
        const isFLAC = entry.flacInfo && entry.flacInfo.isFLAC;
        if (entry.modified) {
          if (isFLAC) {
            entry.buffer = FLAC.write(entry.buffer, entry.metadata, entry.flacInfo);
          } else if (this._isMP3(entry)) {
            entry.buffer = ID3.write(entry.buffer, entry.metadata, entry.id3);
          }
        }
        const blob = new Blob([entry.buffer], { type: entry.file.type || "audio/mpeg" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = entry._downloadName || entry.file.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        count++;
        await new Promise(r => setTimeout(r, 200));
      } catch(e) { failed++; }
    }
    this.toast(`批量下载: ${count} 成功, ${failed} 失败`, count > 0 ? "success" : "error");
  },

  /** Check file deduplication via SHA-256 */
  async checkDuplicate(buffer, fileName) {
    try {
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      const hash = Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, "0")).join("");
      for (const [id, entry] of this.files) {
        if (entry._sha256 === hash) {
          this.toast("检测到重复文件: " + entry.file.name, "warning");
          return true;
        }
      }
      // Find and store hash
      for (const [id, entry] of this.files) {
        if (entry.file.name === fileName && !entry._sha256) {
          const hb2 = await crypto.subtle.digest("SHA-256", entry.buffer);
          entry._sha256 = Array.from(new Uint8Array(hb2))
            .map(b => b.toString(16).padStart(2, "0")).join("");
          break;
        }
      }
      return false;
    } catch (e) { return false; }
  },

  /** Setup drag-and-drop and file input */
  setupDropzone() {
    const dz = document.getElementById("dropzone");
    const input = document.getElementById("fileInput");

    dz.addEventListener("click", () => input.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("dragover"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
    dz.addEventListener("drop", (e) => {
      e.preventDefault();
      dz.classList.remove("dragover");
      this.addFiles(e.dataTransfer.files);
    });
    input.addEventListener("change", () => {
      this.addFiles(input.files);
      input.value = ""; // Reset so same file can be re-selected
    });
  },

  /** Keyboard shortcuts */
  setupKeyboard() {
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        this.saveCurrent();
      }
    });
  },

  /** Add files to the queue and process */
  async addFiles(fileList) {
    const validExts = [".mp3", ".flac", ".m4a", ".mp4", ".ogg", ".wav", ".wma", ".ape"];
    const files = Array.from(fileList).filter((f) => {
      const ext = "." + f.name.split(".").pop().toLowerCase();
      return validExts.includes(ext);
    });

    if (files.length === 0) {
      this.toast("未识别到支持的音频文件", "error");
      return;
    }

    if (files.some((f) => f.size > 100 * 1024 * 1024)) {
      this.toast("存在超过 100MB 的文件，已跳过", "error");
    }

    const valid = files.filter((f) => f.size <= 100 * 1024 * 1024);

    let lastEntryId = null;
    let dupCount = 0;
    let dupNames = [];
    const seenHashes = new Set();
    for (const file of valid) {
      const id = Date.now() + "_" + Math.random().toString(36).slice(2, 8);

      // Read file buffer once (arrayBuffer can only be called once per File)
      let buffer = null;
      let hashHex = null;
      try {
        buffer = await file.arrayBuffer();
        hashHex = await this._sha256(buffer);
        // Check against existing files (cross-batch dedup)
        for (const [eid, e] of this.files) {
          if (e._sha256 === hashHex) { hashHex = "__dup__"; dupCount++; dupNames.push(file.name); break; }
        }
        if (hashHex === "__dup__") continue;
        // Check within current batch
        if (seenHashes.has(hashHex)) { dupCount++; dupNames.push(file.name); continue; }
        seenHashes.add(hashHex);
      } catch(e) { /* proceed without hash */ }

      const entry = {
        id, file,
        buffer: buffer,
        metadata: {},
        id3: null,
        modified: false,
        originalMetadata: {},
        _sha256: hashHex
      };

      if (buffer) {
      try {
        entry.buffer = buffer;

        // Try ID3 first (MP3), then FLAC Vorbis Comment
        const id3 = ID3.read(buffer);
        entry.id3 = id3;

        // Always try FLAC parser (some FLAC files have both ID3v2 and Vorbis Comment)
        const flacInfo = FLAC.read(buffer);
        entry.flacInfo = flacInfo;
        // Parse audio info for display
        if (flacInfo && flacInfo.streamInfo) {
          entry.audioInfo = flacInfo.streamInfo;
        } else if (id3) {
          entry.audioInfo = ID3._parseMP3Info(buffer);
        } else {
          entry.audioInfo = ID3._parseMP3Info(buffer);
        }

        if (flacInfo && flacInfo.metadata && Object.keys(flacInfo.metadata).length > 0) {
          // FLAC file: use Vorbis Comment metadata (more authoritative than ID3 for FLAC)
          entry.metadata = {
            title:       flacInfo.metadata.title       || (id3?.frames?.title   || ""),
            artist:      flacInfo.metadata.artist      || (id3?.frames?.artist  || ""),
            album:       flacInfo.metadata.album       || (id3?.frames?.album   || ""),
            albumArtist: flacInfo.metadata.albumArtist || (id3?.frames?.albumArtist || ""),
            composer:    flacInfo.metadata.composer    || (id3?.frames?.composer || ""),
            year:        flacInfo.metadata.year        || (id3?.frames?.year    || ""),
            track:       flacInfo.metadata.track       || (id3?.frames?.track   || ""),
            disc:        flacInfo.metadata.disc        || (id3?.frames?.disc    || ""),
            genre:       flacInfo.metadata.genre       || (id3?.frames?.genre   || ""),
            comment:     flacInfo.metadata.comment     || (id3?.frames?.comment || ""),
            lyrics:      flacInfo.metadata.lyrics      || (id3?.frames?.lyrics  || ""),
          };
          if (flacInfo.cover) entry.metadata._cover = flacInfo.cover;
          else if (id3?.cover) entry.metadata._cover = id3.cover;
        } else if (id3 && id3.frames) {
          // MP3: use ID3 metadata
          entry.metadata = {
            title:       id3.frames.title       || "",
            artist:      id3.frames.artist      || "",
            album:       id3.frames.album       || "",
            albumArtist: id3.frames.albumArtist || "",
            composer:    id3.frames.composer    || "",
            year:        id3.frames.year        || "",
            track:       id3.frames.track       || "",
            disc:        id3.frames.disc        || "",
            genre:       id3.frames.genre       || "",
            comment:     id3.frames.comment     || "",
            lyrics:      id3.frames.lyrics      || "",
          };
          if (id3.cover) entry.metadata._cover = id3.cover;
        }

        // Store original for reset
        entry.originalMetadata = { ...entry.metadata };
        this.files.set(id, entry);
        lastEntryId = id; // Track for auto-select
      } catch (err) {
        // File corrupted or unreadable — still add with empty metadata
        this.files.set(id, entry);
      }
      } // end if (buffer)
      else { this.files.set(id, entry); }
    }

    this.renderFileList();
    if (dupCount > 0) {
      const show = dupNames.length <= 3 ? dupNames.join("、") : dupNames.slice(0, 3).join("、") + ` 等${dupNames.length}个`;
      this.toast(`已添加 ${valid.length - dupCount} 个，跳过 ${dupCount} 个重复: ${show}`, "warning");
    } else {
      this.toast(`已添加 ${valid.length} 个文件`, "success");
    }

    // Auto-select the most recently uploaded file
    if (lastEntryId) {
      this.selectFile(lastEntryId);
    }
  },

  /** Select a file for editing */
  /** Click on file item: toggle select + switch to tag editor */
  onFileItemClick(event, id) {
    const entry = this.files.get(id);
    if (!entry) return;
    // Toggle selection, then switch active file BEFORE re-rendering
    entry._selected = !entry._selected;

  /** Double-click on file item: play the song */
  onFileItemDblClick(event, id) {

    if (!entry || !entry.buffer) return;
